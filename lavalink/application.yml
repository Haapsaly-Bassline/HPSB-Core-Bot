# Lavalink для HPSB Core Bot — включается на host PC.
# Сейчас бот работает на discord-player (MUSIC_ENGINE=discord-player).
# На host PC: Java 17+ -> java -jar Lavalink.jar -> MUSIC_ENGINE=lavalink
#
# Взять свежий Lavalink.jar (v4): https://github.com/lavalink-devs/Lavalink/releases
# Версии ниже проверены 2026-09-25, перед запуском сверь с релизами:
#   YouTube plugin: https://github.com/lavalink-devs/youtube-source/releases
#   LavaSrc:        https://github.com/topi314/LavaSrc/releases (Spotify/Apple/Deezer через API-ключи)

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    # Тот же пароль впиши в .env -> LAVALINK_PASSWORD
    password: "hpsb-lavalink-change-me"
    sources:
      youtube: false                 # выкл: YouTube идёт через плагин ниже
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: true
      nico: false
      http: true
      local: false
    filters:
      volume: true
    bufferDurationMs: 400
    opusEncodingProfile: "OPUS"        # чистый opus в Discord
    resamplingQuality: LOW             # меньше CPU
    trackStuckThresholdMs: 10000
    useChronicle: true                 # нужен Java 17+ (chronicle bytebuffer вне heap)
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    httpSearchEnabled: false
    localSearchEnabled: false
  plugins:
    # YouTube через официальный плагин (стабильнее встроенного источника)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    # Spotify / Apple Music / Deezer — впиши ключи ниже
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lava-lyrics-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TVHTML5EMBEDDED мёртв — актуальный TVHTML5_SIMPLY. Если режут, крути список/oily.
    clients:
      - MUSIC
      - ANDROID_TESTSUITE
      - TVHTML5_SIMPLY
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""          # Spotify-треки ищутся по ISRC — точные совпадения
      - "ytsearch:%QUERY%"
    sources:
      spotify: true                    # нужен SPOTIFY_CLIENT_ID/SECRET ниже
      applemusic: false                # включи + countryCode, если надо
      deezer: false                    # включи + masterDecryptionKey, если надо
      yandexmusic: false
      vk: false
    spotify:
      preferAnonymousToken: false
      clientId: "PASTE_SPOTIFY_CLIENT_ID"
      clientSecret: "PASTE_SPOTIFY_CLIENT_SECRET"
      countryCode: "EE"
    applemusic:
      countryCode: "EE"
      # mediaApiToken: "..."  # берётся автоматически, руками обычно не нужно
    lyrics:
      sources:
        - spotify
        - youtube

logging:
  level:
    lavalink: INFO
    root: WARN
